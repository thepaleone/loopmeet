name: Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Works out what this change needs built (.github/scripts/ci-scope.sh). Documentation-only
  # changes need nothing; manual runs build everything.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      build_backend: ${{ steps.scope.outputs.build_backend }}
      build_app: ${{ steps.scope.outputs.build_app }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select builds
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: bash .github/scripts/ci-select.sh | tee -a "$GITHUB_OUTPUT"

  build-dotnet:
    name: Build API and Libraries
    needs: changes
    if: needs.changes.outputs.build_backend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json
            global.json

      - name: Restore backend/library projects
        shell: bash
        run: |
          set -euo pipefail
          for project in \
            src/LoopMeet.Core/LoopMeet.Core.csproj \
            src/LoopMeet.Infrastructure/LoopMeet.Infrastructure.csproj \
            src/LoopMeet.Api/LoopMeet.Api.csproj; do
            echo "Restoring $project"
            dotnet restore "$project"
          done

      - name: Build backend/library projects
        shell: bash
        run: |
          set -euo pipefail
          for project in \
            src/LoopMeet.Core/LoopMeet.Core.csproj \
            src/LoopMeet.Infrastructure/LoopMeet.Infrastructure.csproj \
            src/LoopMeet.Api/LoopMeet.Api.csproj; do
            echo "Building $project"
            dotnet build "$project" --configuration Release --no-restore
          done

  build-maui-android:
    name: Compile MAUI App (Android)
    needs: changes
    if: needs.changes.outputs.build_app == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json
            global.json

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore MAUI app
        run: dotnet restore src/LoopMeet.App/LoopMeet.App.csproj

      - name: Compile MAUI app (Android)
        run: dotnet build src/LoopMeet.App/LoopMeet.App.csproj -f net10.0-android -t:Compile --configuration Release --no-restore

  # The one check to require on main: it always reports, passing when every build this change
  # needed passed and the rest were skipped.
  build-gate:
    name: Build Gate
    needs: [changes, build-dotnet, build-maui-android]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check build results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
